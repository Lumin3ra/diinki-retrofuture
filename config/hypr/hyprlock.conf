# sample hyprlock.conf
# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock
#
# rendered text in all widgets supports pango markup (e.g. <b> or <i> tags)
# ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#general-remarks
#
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace
#
# you can get started by copying this config to ~/.config/hypr/hyprlock.conf
#

$font = Maple Mono
$font_color = rgba(d8cab8ff)

general {
    hide_cursor = true
}

# uncomment to enable fingerprint authentication
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan fingerprint to unlock
#         present_message = Scanning...
#         retry_delay = 250 # in milliseconds
#     }
# }

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = ~/.config/hypr/wallpapers/2CB.png
    blur_passes = 10
    noise = 0.01
}

input-field {
    monitor =
    size = 20%, 60
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    outer_color = rgba(d8cab8ff)
    check_color = rgba(8F56E1ff)
    fail_color = rgba(fcb167ff)

    font_color = rgba(d8cab8ff)
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text = Input password...
    fail_text = $PAMFAIL

    # uncomment to use a letter instead of a dot to indicate the typed password
    # dots_text_format = *
    # dots_size = 0.4
    dots_spacing = 0.3

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0, -20
    halign = center
    valign = center
}

# MESSAGE
label {
    monitor =
    text = AWAITING USER
    font_size = 50
    font_family = $font
    color = $font_color

    position = 0, 60
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME // LOCAL # ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution
    font_size = 20
    font_family = $font
    color = $font_color

    position = 0, 0
    halign = left
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%d.%m.%Y" # update every 60 seconds
    font_size = 20
    font_family = $font
    color = $font_color

    position = 0, -25
    halign = left
    valign = top
}

# USER
label {
    monitor =
    text = $USER
    font_size = 20
    font_family = $font
    color = $font_color

    position = 0, 0
    halign = right
    valign = top
}

# LAYOUT
label {
    monitor =
    text = $LAYOUT
    font_size = 20
    font_family = $font
    color = $font_color

    position = 0, -25
    halign = right
    valign = top
}

